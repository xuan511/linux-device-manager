name: CI

on:
  push:
  pull_request:

jobs:
  linux-build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug -j2
      - name: Test
        shell: bash
        run: |
          set +e
          output=$(ctest --preset debug --output-on-failure 2>&1)
          status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              printf '::error::%s\n' "$line"
            done < <(tail -n 40 <<<"$output" | tac)
          fi
          exit "$status"
      - name: Configure Release
        run: cmake --preset release
      - name: Build Release
        run: cmake --build --preset release -j2
      - name: Verify staged install
        run: cmake --install build/release --prefix "$RUNNER_TEMP/devmgr-install"

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure ASan and UBSan
        run: cmake --preset asan
      - name: Build ASan and UBSan
        run: cmake --build --preset asan -j2
      - name: Test ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset asan --output-on-failure

  valgrind:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Run Valgrind suite
        run: ./scripts/run-valgrind.sh
